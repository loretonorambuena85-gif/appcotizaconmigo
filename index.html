<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Cotizaciones Profesional</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f0f2f5;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .app-container {
      max-width: 850px;
      margin: auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #eef2f5;
      padding-bottom: 15px;
      margin-bottom: 25px;
    }
    .app-header h1 {
      margin: 0;
      font-size: 24px;
      color: #1a2a3a;
    }
   
    #pdf-area {
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
    }
   
    .invoice-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 25px;
      gap: 20px;
    }
    .logo-container {
      width: 45%;
    }
    .logo-preview {
      max-width: 180px;
      max-height: 100px;
      object-fit: contain;
      display: none;
      margin-bottom: 10px;
    }
    .company-details {
      margin-top: 10px;
    }
    .meta-details {
      width: 50%;
      text-align: right;
    }
    .meta-details h2 {
      margin: 0 0 10px 0;
      color: #2c3e50;
      font-size: 28px;
      letter-spacing: 1px;
    }
   
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 25px;
    }
    .card-info {
      background: #f8fafc;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }
    .card-info h3 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 14px;
      text-transform: uppercase;
      color: #64748b;
      letter-spacing: 0.5px;
    }
   
    .form-group {
      margin-bottom: 10px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 4px;
    }
    .form-control {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13px;
      transition: border-color 0.2s;
    }
    .form-control:focus {
      outline: none;
      border-color: #2563eb;
    }
   
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 15px;
    }
    th {
      background-color: #1e293b;
      color: #ffffff;
      padding: 10px 12px;
      font-size: 13px;
      text-align: left;
      font-weight: 600;
    }
    th:first-child { border-top-left-radius: 6px; }
    th:last-child { border-top-right-radius: 6px; }
    td {
      padding: 8px 10px;
      border-bottom: 1px solid #e2e8f0;
    }
   
    .btn {
      padding: 9px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.2s;
    }
    .btn-add {
      background-color: #10b981;
      color: white;
    }
    .btn-add:hover { background-color: #059669; }
    .btn-delete {
      background-color: #ef4444;
      color: white;
      padding: 5px 8px;
      font-size: 11px;
    }
    .btn-delete:hover { background-color: #dc2626; }
    .btn-pdf {
      background-color: #2563eb;
      color: white;
      width: 100%;
      padding: 12px;
      font-size: 16px;
      justify-content: center;
      margin-top: 20px;
    }
    .btn-pdf:hover { background-color: #1d4ed8; }
   
    .summary-container {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: 20px;
    }
    .notes-area {
      width: 55%;
    }
    .totals-area {
      width: 42%;
      background: #f8fafc;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }
    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 14px;
      color: #334155;
    }
    .total-row.final {
      border-top: 2px solid #cbd5e1;
      margin-top: 8px;
      padding-top: 10px;
      font-size: 18px;
      font-weight: bold;
      color: #0f172a;
    }
    .tax-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 13px;
      user-select: none;
    }
   
    .no-pdf {
      display: block;
    }
    
    .pdf-mode .no-pdf {
      display: none !important;
    }
    .pdf-mode input, .pdf-mode textarea {
      border: none !important;
      background: transparent !important;
      padding: 0 !important;
      resize: none;
    }
    .pdf-mode .app-container {
      box-shadow: none !important;
      padding: 10px !important;
      max-width: 100% !important;
    }
    .pdf-mode #pdf-area {
      padding: 5px !important;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

  <div class="app-container">
    <div class="app-header no-pdf">
      <h1>Generador de Cotizaciones</h1>
      <span id="badge-estado" style="font-size: 12px; padding: 4px 10px; border-radius: 12px; background: #e2e8f0; color: #334155; font-weight:600;">Modo Prueba (2 Descargas Gratis)</span>
    </div>

    <div id="pdf-area">
     
      <div class="invoice-header">
        <div class="logo-container">
          <img id="logo-preview" class="logo-preview" alt="Logo de la Empresa">
          <div class="upload-btn-wrapper no-pdf" style="margin-bottom: 10px;">
            <label for="logo-input" class="btn" style="background:#e2e8f0; color:#334155;">📷 Cargar Logo</label>
            <input type="file" id="logo-input" accept="image/*" style="display:none;" onchange="cargarLogo(event)">
          </div>
          <div class="company-details">
            <input type="text" class="form-control" placeholder="Nombre de tu Empresa / Tu Nombre" style="font-weight: bold; font-size: 15px;">
            <input type="text" class="form-control" placeholder="RUT / NIF / Tax ID" style="margin-top:4px;">
            <input type="tel" class="form-control" placeholder="Teléfono del Prestador / Empresa" style="margin-top:4px;">
            <input type="text" class="form-control" placeholder="Email / Dirección" style="margin-top:4px;">
          </div>
        </div>
       
        <div class="meta-details">
          <h2>COTIZACIÓN</h2>
          <div class="form-group" style="display:flex; justify-content:flex-end; align-items:center; gap:8px;">
            <label style="margin:0;">N° Cotización:</label>
            <input type="text" class="form-control" value="0001" style="width: 100px; text-align:right;">
          </div>
          <div class="form-group" style="display:flex; justify-content:flex-end; align-items:center; gap:8px;">
            <label style="margin:0;">Fecha:</label>
            <input type="date" id="fecha-cotizacion" class="form-control" style="width: 140px; text-align:right;">
          </div>
        </div>
      </div>

      <div class="grid-2">
        <div class="card-info">
          <h3>Cliente</h3>
          <div class="form-group">
            <input type="text" id="cliente-nombre" class="form-control" placeholder="Nombre del cliente o Empresa">
          </div>
          <div class="form-group">
            <input type="tel" class="form-control" placeholder="Teléfono de contacto del cliente (Ej: +56 9 1234 5678)">
          </div>
          <div class="form-group">
            <input type="text" class="form-control" placeholder="RUT / Identificación fiscal">
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <input type="text" class="form-control" placeholder="Email / Dirección del cliente">
          </div>
        </div>

        <div class="card-info">
          <h3>Condiciones</h3>
          <div class="form-group">
            <label>Validez de la oferta:</label>
            <input type="text" class="form-control" value="15 días hábiles">
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label>Forma de Pago:</label>
            <input type="text" class="form-control" placeholder="Ej: 50% transferencia, 50% entrega">
          </div>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th style="width: 45%;">Descripción / Concepto</th>
            <th style="width: 15%; text-align: center;">Cant.</th>
            <th style="width: 20%; text-align: right;">Precio Unit. ($)</th>
            <th style="width: 20%; text-align: right;">Total ($)</th>
            <th class="no-pdf" style="width: 40px;"></th>
          </tr>
        </thead>
        <tbody id="items-body">
          <tr>
            <td><input type="text" class="form-control item-desc" placeholder="Descripción del servicio o producto"></td>
            <td><input type="number" class="form-control item-cant" value="1" min="1" style="text-align:center;" oninput="calcularTotales()"></td>
            <td><input type="number" class="form-control item-precio" value="0" min="0" style="text-align:right;" oninput="calcularTotales()"></td>
            <td style="text-align:right; font-weight:600;" class="item-subtotal">$0</td>
            <td class="no-pdf"><button class="btn btn-delete" onclick="eliminarFila(this)">✕</button></td>
          </tr>
        </tbody>
      </table>

      <button class="btn btn-add no-pdf" onclick="agregarFila()">+ Agregar Concepto</button>

      <div class="summary-container">
        <div class="notes-area">
          <label style="font-size:12px; font-weight:600; color:#475569;">Notas o Términos Adicionales:</label>
          <textarea class="form-control" rows="4" style="margin-top:5px;" placeholder="Ej: Precios sujetos a variación si cambian las especificaciones. Garantía de 3 meses."></textarea>
        </div>

        <div class="totals-area">
          <div class="total-row">
            <span>Subtotal:</span>
            <span id="monto-subtotal" style="font-weight:600;">$0</span>
          </div>

          <div class="total-row">
            <label class="tax-toggle">
              <input type="checkbox" id="check-iva" checked onchange="calcularTotales()">
              <span>Incluir IVA:</span>
            </label>
            <div style="display:flex; align-items:center; gap:4px;">
              <input type="number" id="porcentaje-iva" value="19" style="width:65px; text-align:center;" class="form-control" oninput="calcularTotales()">
              <span>%</span>
            </div>
          </div>

          <div class="total-row">
            <span>Monto IVA:</span>
            <span id="monto-iva" style="font-weight:600;">$0</span>
          </div>

          <div class="total-row final">
            <span>TOTAL:</span>
            <span id="monto-total" style="color:#2563eb;">$0</span>
          </div>
        </div>
      </div>

    </div>

    <button class="btn btn-pdf no-pdf" onclick="descargarPDF()">📄 Descargar Cotización en PDF</button>
  </div>

  <script>
    const DESCARGAS_GRATIS_PERMITIDAS = 2;
    const LINK_DE_PAGO = "https://mpago.la/2F1pcX8";

    document.addEventListener("DOMContentLoaded", () => {
      const hoy = new Date().toISOString().split('T')[0];
      document.getElementById('fecha-cotizacion').value = hoy;
     
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('pago') === 'exitoso') {
        localStorage.setItem('cotiz_usuario_vip', 'true');
        alert("🎉 ¡Pago confirmado! Ahora tienes Pase Ilimitado para descargar cotizaciones.");
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      actualizarBadgeEstado();
      calcularTotales();
    });

    function actualizarBadgeEstado() {
      const esVIP = localStorage.getItem('cotiz_usuario_vip') === 'true';
      const badge = document.getElementById('badge-estado');
      if (esVIP) {
        badge.innerText = "⭐ Pase Ilimitado Activo";
        badge.style.background = "#dcfce7";
        badge.style.color = "#166534";
      } else {
        const usadas = parseInt(localStorage.getItem('cotiz_descargas_usadas') || '0');
        const rest = DESCARGAS_GRATIS_PERMITIDAS - usadas;
        badge.innerText = rest > 0 ? `Modo Prueba (${rest} Gratis)` : "Límite Alcanzado";
        badge.style.background = rest > 0 ? "#e2e8f0" : "#fee2e2";
        badge.style.color = rest > 0 ? "#334155" : "#991b1b";
      }
    }

    function cargarLogo(event) {
      const reader = new FileReader();
      reader.onload = function() {
        const preview = document.getElementById('logo-preview');
        preview.src = reader.result;
        preview.style.display = 'block';
      };
      if(event.target.files[0]) {
        reader.readAsDataURL(event.target.files[0]);
      }
    }

    function agregarFila() {
      const tbody = document.getElementById('items-body');
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input type="text" class="form-control item-desc" placeholder="Descripción del servicio o producto"></td>
        <td><input type="number" class="form-control item-cant" value="1" min="1" style="text-align:center;" oninput="calcularTotales()"></td>
        <td><input type="number" class="form-control item-precio" value="0" min="0" style="text-align:right;" oninput="calcularTotales()"></td>
        <td style="text-align:right; font-weight:600;" class="item-subtotal">$0</td>
        <td class="no-pdf"><button class="btn btn-delete" onclick="eliminarFila(this)">✕</button></td>
      `;
      tbody.appendChild(tr);
    }

    function eliminarFila(btn) {
      const filas = document.querySelectorAll('#items-body tr');
      if (filas.length > 1) {
        btn.closest('tr').remove();
        calcularTotales();
      } else {
        alert("Debes mantener al menos una línea en la cotización.");
      }
    }

    function calcularTotales() {
      const cants = document.querySelectorAll('.item-cant');
      const precios = document.querySelectorAll('.item-precio');
      const subtotales = document.querySelectorAll('.item-subtotal');

      let acumuladoSubtotal = 0;

      cants.forEach((cantInput, index) => {
        const cant = parseFloat(cantInput.value) || 0;
        const precio = parseFloat(precios[index].value) || 0;
        const sublinea = cant * precio;
       
        subtotales[index].innerText = '$' + sublinea.toLocaleString('es-CL');
        acumuladoSubtotal += sublinea;
      });

      const aplicaIVA = document.getElementById('check-iva').checked;
      const pctIVA = parseFloat(document.getElementById('porcentaje-iva').value) || 19;
     
      let montoIVA = 0;
      if (aplicaIVA) {
        montoIVA = acumuladoSubtotal * (pctIVA / 100);
      }

      const totalFinal = acumuladoSubtotal + montoIVA;

      document.getElementById('monto-subtotal').innerText = '$' + Math.round(acumuladoSubtotal).toLocaleString('es-CL');
      document.getElementById('monto-iva').innerText = '$' + Math.round(montoIVA).toLocaleString('es-CL');
      document.getElementById('monto-total').innerText = '$' + Math.round(totalFinal).toLocaleString('es-CL');
    }

    function descargarPDF() {
      const usuarioEsVIP = localStorage.getItem('cotiz_usuario_vip') === 'true';
      let descargasUsadas = parseInt(localStorage.getItem('cotiz_descargas_usadas') || '0');

      if (!usuarioEsVIP && descargasUsadas >= DESCARGAS_GRATIS_PERMITIDAS) {
        if (confirm("⚡ Has superado tus 2 descargas gratuitas de prueba.\n\n¿Deseas activar tu Pase Ilimitado ahora por solo $2.990 CLP?")) {
          window.location.href = LINK_DE_PAGO;
        }
        return;
      }

      const pdfArea = document.getElementById('pdf-area');
      const cliente = document.getElementById('cliente-nombre').value.trim() || 'Cliente';
     
      const opciones = {
        margin: [5, 5, 5, 5], 
        filename: `Cotizacion_${cliente.replace(/\s+/g, '_')}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, letterRendering: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      document.body.classList.add('pdf-mode');

      html2pdf().set(opciones).from(pdfArea).save().then(() => {
        document.body.classList.remove('pdf-mode');
       
        if (!usuarioEsVIP) {
          descargasUsadas++;
          localStorage.setItem('cotiz_descargas_usadas', descargasUsadas);
          actualizarBadgeEstado();
        }
      });
    }
  </script>
</body>
</html>
